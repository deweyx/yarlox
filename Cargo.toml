[package]
name = "yarlox"
version = "0.1.0"
edition = "2024"
resolver = "2"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
yarlox-scanner.path = "./crates/scanner"
clap = { version = "4.5.61", features = ["derive"] }

[dependencies]
yarlox-scanner.workspace = true
clap.workspace = true
